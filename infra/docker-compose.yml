name: han

# HAN: Docker Compose for the initial demonstrator (spec §13). Run from the repository root:
#   cp .env.example .env   # fill in every value marked CHANGE_ME
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
# Optional model runtime (separate service, needs weights + licence clearance): add `--profile inference`.

x-backend-env: &backend-env
  HAN_ENV: ${HAN_ENV:-production}
  HAN_SECRET_KEY: ${HAN_SECRET_KEY:?set HAN_SECRET_KEY (32+ random characters)}
  HAN_DATABASE_URL: postgresql+psycopg://han:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/han
  HAN_REDIS_URL: redis://redis:6379/0
  HAN_COOKIE_SECURE: ${HAN_COOKIE_SECURE:-1}
  HAN_TRUST_PROXY: ${HAN_TRUST_PROXY:-0}
  HAN_GOOGLE_API_KEY: ${HAN_GOOGLE_API_KEY:-}
  HAN_MADLAD_URL: ${HAN_MADLAD_URL:-}
  HAN_AFRINLLB_URL: ${HAN_AFRINLLB_URL:-}
  HAN_NLLB_URL: ${HAN_NLLB_URL:-}
  HAN_INFERENCE_TOKEN: ${HAN_INFERENCE_TOKEN:-}
  HAN_ENABLE_MOCK_PROVIDER: ${HAN_ENABLE_MOCK_PROVIDER:-0}
  HAN_BOOTSTRAP_TNI_ADMIN_EMAIL: ${HAN_BOOTSTRAP_TNI_ADMIN_EMAIL:-}
  HAN_BOOTSTRAP_TECH_ADMIN_EMAIL: ${HAN_BOOTSTRAP_TECH_ADMIN_EMAIL:-}
  HAN_BOOTSTRAP_TNI_ADMIN_PASSWORD: ${HAN_BOOTSTRAP_TNI_ADMIN_PASSWORD:-}
  HAN_BOOTSTRAP_TECH_ADMIN_PASSWORD: ${HAN_BOOTSTRAP_TECH_ADMIN_PASSWORD:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: han
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: han
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han -d han"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  migrate:
    build: ../backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  backend:
    build: ../backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]   # loopback only: the browser reaches the API through the frontend proxy
    restart: unless-stopped

  worker:
    build: ../backend
    command: celery -A app.jobs.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ../frontend
    environment:
      HAN_BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped

  inference:
    profiles: ["inference"]
    build: ../inference
    environment:
      HAN_INFERENCE_TOKEN: ${HAN_INFERENCE_TOKEN:?set HAN_INFERENCE_TOKEN}
      HAN_INFERENCE_MODEL_MADLAD: ${HAN_INFERENCE_MODEL_MADLAD:-}
      HAN_INFERENCE_MODEL_NLLB: ${HAN_INFERENCE_MODEL_NLLB:-}
      HAN_INFERENCE_MODEL_AFRINLLB: ${HAN_INFERENCE_MODEL_AFRINLLB:-}
    volumes: ["../models:/models"]     # optional local model cache; never commit weights
    expose: ["9000"]
    restart: unless-stopped

volumes:
  pgdata:
